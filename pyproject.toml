[project]
name = "sim-bim-agent"
version = "0.1.0"
description = "Sim BIM Agent: lightweight BIM generation with independent model runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.13.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mcp==1.27.0",
    "numpy==2.4.4",
    "pillow==12.2.0",
    "portalocker==3.2.0",
    "pydantic==2.13.3",
    "pyjwt[crypto]==2.12.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "scipy==1.17.1",
    "shapely==2.1.2",
    "trimesh==4.11.5",
]

[project.scripts]
sim-bim-agent = "src.agent.product_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-n", "0", "-p", "no_billed_gate"]
markers = [
    "mutation: fresh-process source-mutation matrix; excluded from child pytest runs",
    "fast: current product checks suitable for everyday development",
    "targeted: current checks selected for the affected capability",
    "node: current end-to-end and integration acceptance",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
    "N",
]

ignore = [
    "E501", # Line too long
    "N805",
    "N806"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
]
