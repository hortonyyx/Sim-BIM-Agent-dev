<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sim-BIM</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column}iframe{flex:1;min-height:0;width:100%;border:0;display:block}</style>
</head>
<body>
  <nav class="model-return" aria-label="Workspace"><a id="inputs-link" href="/">Inputs</a><span aria-hidden="true">/</span><a id="activity-link">Run activity</a></nav>
  <iframe title="Sim-BIM" sandbox="allow-scripts allow-downloads"></iframe>
  <script src="/static/viewer-draft.js"></script>
  <script>
    const path=location.hash.slice(1), lang=new URLSearchParams(location.search).get('lang')==='zh-CN'?'zh-CN':'en';
    if (!SimBimViewerDraft.host(document.querySelector('iframe'),path,lang)) location.replace('/');
    const activity=new URL('/static/run.html',location.origin);
    activity.searchParams.set('id',path.split('/')[3]);activity.searchParams.set('lang',lang);
    document.documentElement.lang=lang;
    document.querySelector('nav').setAttribute('aria-label',lang==='en'?'Workspace':'工作区');
    document.querySelector('#inputs-link').textContent=lang==='en'?'Inputs':'输入';
    const link=document.querySelector('#activity-link');
    link.textContent=lang==='en'?'Run activity':'运行记录';link.href=activity.href;
    window.addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
